<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8"/>
        <title>To-Do List</title>
    </head>
    <body>
        <ul id="myTodos"></ul>
        <input type="text" id="todoField">
        <button onclick="addTodo()">ToDo hinzufügen</button>
        <script>
            function addTodo(){
                myTodos.innerHTML += `
                <li>${todoField.value}</li>
                `;
                todoField.value = '';
            }
        </script>
    </body>
</html>
